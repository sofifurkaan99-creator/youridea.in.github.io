<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>youridea.in Admin</title>
  <meta name="description" content="Admin dashboard for youridea.in" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="login-screen" class="screen active">
    <div class="login-shell">
      <div class="brand-card">
        <div class="brand-mark">
          <img src="../images/youridea-logo.svg" alt="youridea.in logo" />
        </div>
        <div class="brand-title">youridea.in</div>
        <p>Premium studio admin access</p>
      </div>

      <form id="login-form" class="login-form">
        <h2>Admin Login</h2>
        <label>
          <span>Username</span>
          <input type="text" id="username" value="admin" required />
        </label>
        <label>
          <span>Password</span>
          <input type="password" id="password" value="admin123" required />
        </label>
        <button type="submit">Login to dashboard</button>
        <p class="demo-note">Demo login: admin / admin123</p>
      </form>
    </div>
  </div>

  <div id="dashboard" class="screen">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark small">
          <img src="../images/youridea-logo.svg" alt="youridea.in" />
        </div>
        <div>
          <div class="brand-title">youridea.in</div>
          <small>Admin Panel</small>
        </div>
      </div>

      <nav class="nav-menu">
        <a href="#" class="active"><i class="fas fa-house"></i> Overview</a>
        <a href="#"><i class="fas fa-folder-open"></i> Projects</a>
        <a href="#"><i class="fas fa-envelope"></i> Enquiries</a>
        <a href="#"><i class="fas fa-box"></i> Services</a>
      </nav>

      <button id="logout-btn" class="logout-btn">Logout</button>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <p class="eyebrow">Studio overview</p>
          <h1>Dashboard</h1>
        </div>
        <div class="user-pill">Welcome, Admin</div>
      </header>

      <section class="stats-grid" id="stats-grid"></section>

      <section class="panel-row">
        <div class="panel large-panel">
          <div class="panel-head">
            <h3>Projects</h3>
            <button id="toggle-project-form" class="mini-btn">+ Add project</button>
          </div>

          <form id="project-form" class="compact-form hidden">
            <div class="input-row">
              <input type="text" id="project-title" placeholder="Project title" required />
              <input type="text" id="project-client" placeholder="Client" required />
            </div>
            <div class="input-row">
              <input type="text" id="project-value" placeholder="Value" />
              <input type="number" id="project-progress" min="0" max="100" value="50" />
            </div>
            <div class="input-row">
              <select id="project-status">
                <option>New</option>
                <option>Proposal</option>
                <option>In Progress</option>
                <option>Live</option>
              </select>
              <button type="submit" class="primary-btn">Save</button>
            </div>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Project</th>
                  <th>Client</th>
                  <th>Status</th>
                  <th>Value</th>
                  <th>Progress</th>
                </tr>
              </thead>
              <tbody id="projects-body"></tbody>
            </table>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>Services</h3>
          </div>
          <div id="services-list" class="chip-list"></div>
        </div>
      </section>

      <section class="panel-row">
        <div class="panel">
          <div class="panel-head">
            <h3>Enquiries</h3>
          </div>
          <div id="enquiries-list" class="list-stack"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>Pricing</h3>
          </div>
          <div id="pricing-list" class="pricing-list"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
