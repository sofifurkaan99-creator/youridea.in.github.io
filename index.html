<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=home.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YourIdea.in</title>
  <meta name="description" content="YourIdea.in | AI, Web, App & Startup Studio" />
  <style>
    :root {
      --bg: #050b14;
      --white: #eef5ff;
      --muted: #9aaec7;
      --line: rgba(255,255,255,0.08);
      --primary: #f5c34b;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(circle at 50% -10%, rgba(245,195,75,0.14), transparent 28%), linear-gradient(180deg, #050b14 0%, #091521 100%);
      color: var(--white);
      font-family: Inter, Arial, sans-serif;
    }
    body {
      display: grid; place-items: center;
      text-align: center;
      padding: 24px;
    }
    .box {
      width: min(500px, 100%);
      padding: 32px 24px;
      border-radius: 24px;
      background: rgba(10,15,24,0.8);
      border: 1px solid var(--line);
      box-shadow: 0 28px 60px rgba(0,0,0,0.15);
    }
    .tag {
      display: inline-flex;
      padding: 8px 12px;
      border-radius: 999px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.06em;
    }
    p { color: var(--muted); line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), #ffd977);
      color: #170f09;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="tag">YourIdea.in</div>
    <h1>Redirecting to the homepage...</h1>
    <p>If you are not redirected automatically, click below to open the main site.</p>
    <a href="home.html">Open Home</a>
  </div>
</body>
</html>
