<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>youridea.in | Elite Web Solutions</title>
  <meta name="theme-color" content="#f5c34b" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0a0d14;
      --panel: #111827;
      --panel-2: #171f2f;
      --primary: #f5c34b;
      --primary-strong: #f0b921;
      --accent: #1ea2ff;
      --text: #edf3ff;
      --muted: #aab7d0;
      --line: rgba(255,255,255,0.1);
      --glow: rgba(245,195,75,0.28);
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family:'Inter',sans-serif;
      background: linear-gradient(180deg, #0a0d14 0%, #0d1426 100%);
      color: var(--text);
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
    }
    a { text-decoration:none; color:inherit; }
    .brand-wrap {
      min-height:100vh;
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% -20%, rgba(245,195,75,0.18), transparent 38%),
        radial-gradient(circle at 80% 20%, rgba(30,162,255,0.14), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(245,195,75,0.12), transparent 28%);
    }
    .brand-wrap::before, .brand-wrap::after {
      content:"";
      position:absolute;
      width:520px; height:520px; border-radius:50%;
      filter:blur(80px); opacity:0.4;
      pointer-events:none;
    }
    .brand-wrap::before { background: rgba(245,195,75,0.22); top:-180px; left:50%; transform:translateX(-50%); }
    .brand-wrap::after { background: rgba(30,162,255,0.12); bottom:-180px; right:-60px; }
    .inner {
      position:relative;
      z-index:1;
      text-align:center;
      display:flex; flex-direction:column; align-items:center; gap:26px;
      padding:30px 20px;
    }
    .logo-mark {
      width: min(62vw, 300px);
      filter:drop-shadow(0 18px 35px rgba(245,195,75,.25));
    }
    .brand-name {
      font-size: clamp(2.2rem, 4vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.08em;
      color: #fff;
      text-transform: lowercase;
    }
    .brand-name .accent { color: var(--primary); }
    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .button {
      margin-top: 10px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 16px 28px;
      border:1px solid rgba(245,195,75,0.5);
      border-radius:999px;
      background: rgba(245,195,75,0.12);
      color: var(--text);
      box-shadow: 0 0 20px rgba(245,195,75,0.15);
      font-weight:700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: 0.25s ease;
    }
    .button:hover {
      transform: translateY(-2px);
      background: rgba(245,195,75,0.18);
    }
  </style>
</head>
<body>
  <div class="brand-wrap">
    <div class="inner">
      <img class="logo-mark" src="images/youridea-logo.svg" alt="youridea.in logo" />
      <div class="brand-name"><span class="accent">your</span>idea.in</div>
      <div class="sub">Branding • Web Design • Digital Growth</div>
      <a class="button" href="home.html">Enter Site <i class="fas fa-arrow-right"></i></a>
    </div>
  </div>
</body>
</html>
